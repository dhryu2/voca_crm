# ============================================
# Docker Compose 설정 파일
# ============================================
# VocaCRM API 서버를 Docker 컨테이너로 실행
# PostgreSQL은 외부 서버 사용 (컨테이너 아님)

# 최신 docker compose는 version 필요없다.
#version: '3.8'

services:
  # Spring Boot API 서비스
  api:
    # Docker 이미지 (.env 파일의 DOCKER_IMAGE 사용)
    image: ${DOCKER_IMAGE}

    # 컨테이너 이름
    container_name: voca_crm_api

    # 호스트 네트워크 사용 (localhost로 PostgreSQL 접근 가능)
    network_mode: host

    # 재시작 정책
    restart: unless-stopped

    # 환경 변수 (.env 파일에서 자동 로드)
    environment:
      # 애플리케이션 설정
      APP_NAME: ${APP_NAME}
      SERVER_PORT: ${SERVER_PORT}

      # 데이터베이스 연결 (호스트의 localhost)
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Redis
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}

      # AI Server (Ollama)
      AI_SERVER_URL: ${AI_SERVER_URL}
      AI_MODEL_NAME: ${AI_MODEL_NAME}

      # Spring Boot 프로파일
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # JVM 옵션
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1024m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Dfile.encoding=UTF-8
        -Duser.timezone=Asia/Seoul

    # 볼륨 (로그 파일 영구 저장)
    volumes:
      - api_logs:/app/logs

    # 헬스체크
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  api_logs:
    driver: local
